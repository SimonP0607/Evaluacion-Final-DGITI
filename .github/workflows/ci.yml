name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            app/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  terraform:
    name: Validación de Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  plan:
    name: Preparación del despliegue
    needs: [pruebas, terraform]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_repo_url: ${{ github.server_url }}/${{ github.repository }}.git
      TF_VAR_repo_branch: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - id: secretos
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] && [ -n "$TF_VAR_db_password" ]; then
            echo "disponibles=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponibles=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan los secretos de AWS o DB_PASSWORD. Se omite el plan."
          fi
      - if: steps.secretos.outputs.disponibles == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - if: steps.secretos.outputs.disponibles == 'true'
        run: terraform init -input=false
      - if: steps.secretos.outputs.disponibles == 'true'
        run: terraform plan -input=false -no-color